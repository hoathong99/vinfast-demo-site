name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        env:
          BASE_PATH: ${{ endsWith(github.repository, '.github.io') && '/' || format('/{0}/', github.event.repository.name) }}
          SITE_URL: https://${{ github.repository_owner }}.github.io
          PUBLIC_SHEET_ENDPOINT: ${{ vars.PUBLIC_SHEET_ENDPOINT }}
          PUBLIC_API_ENDPOINT: ${{ vars.PUBLIC_API_ENDPOINT }}
          PUBLIC_EVENT_ENDPOINT: ${{ vars.PUBLIC_EVENT_ENDPOINT }}
          PUBLIC_WORKER_NAME: ${{ vars.PUBLIC_WORKER_NAME }}
          PUBLIC_WORKERS_SUBDOMAIN: ${{ vars.PUBLIC_WORKERS_SUBDOMAIN }}
          PUBLIC_PRODUCTION_ORIGIN: ${{ vars.PUBLIC_PRODUCTION_ORIGIN }}
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
